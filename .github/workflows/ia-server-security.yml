name: ia-server security gates

on:
  push:
    branches: [main]
    paths:
      - "ia/**"
      - ".github/workflows/ia-server-security.yml"
  pull_request:
    paths:
      - "ia/**"
      - ".github/workflows/ia-server-security.yml"

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scanning (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  compose-validate:
    name: Docker Compose config validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: |
          docker compose -f ia/docker-compose.yaml config --quiet

  dockerfile-lint:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ia/ollama/Dockerfile

  image-scan:
    name: Image vulnerability scan (trivy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build ollama image
        run: docker build -t ia-server/ollama:ci ia/ollama
      - name: Scan image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ia-server/ollama:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: table

      - name: Save Trivy report (non-blocking triage)
        if: always()
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy:latest image \
            --severity HIGH,CRITICAL --ignore-unfixed \
            --format json --output trivy-report.json ia-server/ollama:ci || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: ignore

services:
  ollama:
    container_name: ollama
    build:
      context: ./ollama
      dockerfile: Dockerfile
    ports:
      - 127.0.0.1:11434:11434
    restart: always
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    networks:
      - ia-net
    environment:
      - OLLAMA_MODELS=/ollama/models
    volumes:
      - ./ollama/models:/ollama/models
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  open-webui:
    container_name: open-webui
    image: ghcr.io/open-webui/open-webui:v0.5.20-cuda
    ports:
      - 127.0.0.1:3000:8080
    environment:
      RAG_EMBEDDING_ENGINE: ollama
      AUDIO_STT_ENGINE: openai
      OLLAMA_BASE_URL: http://ollama:11434
      ENABLE_SIGNUP: "false"
    extra_hosts:
      - host.docker.internal:host-gateway
    volumes:
      - ./open-webui:/app/backend/data
    restart: always
    security_opt:
      - no-new-privileges:true
    networks:
      - ia-net
    depends_on:
      ollama:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

networks:
  ia-net:
    driver: bridge
